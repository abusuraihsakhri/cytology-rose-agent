name: Cytology ROSE tests and security checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Set ephemeral audit key
        run: |
          key="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::$key"
          echo "AUDIT_SECRET_KEY=$key" >> "$GITHUB_ENV"
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,test]"
          python -m pip check
      - name: Python syntax and tests
        run: |
          python -m compileall -q agents cytology_rose_agent cli.py cyto_rose.py enrichment.py
          python -m pytest -v
      - name: Audit-signature smoke test
        run: |
          python - <<'PY'
          from agents.base import AuditTrail
          trail = AuditTrail()
          record = trail.log("ci", "test", "verification", {"task_id": "T-1"})
          assert trail.verify_integrity()
          trail.logs[0]["event_type"] = "altered"
          assert not trail.verify_integrity()
          PY
      - name: Browser JavaScript checks
        run: |
          node --check web/app.mjs
          node --test web/test.mjs
