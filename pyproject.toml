[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cytology-rose-engine"
version = "2.0.0"
description = "Prototype tools for cytology rapid on-site evaluation and specimen QC"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Dr. Abu Suraih Sakhri" }]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps",
]
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.100", "uvicorn>=0.23"]
test = ["pytest>=7", "httpx>=0.25"]

[project.scripts]
cytology-rose-engine = "cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/cytology-rose-agent"
Repository = "https://github.com/abusuraihsakhri/cytology-rose-agent"

[tool.setuptools]
py-modules = ["cli", "cyto_rose", "cyto_rose_app", "cytology_rose_agent_app", "enrichment", "simulator"]

[tool.setuptools.packages.find]
include = ["agents", "agents.*", "cytology_rose_agent", "cytology_rose_agent.*"]
